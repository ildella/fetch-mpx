name: CI

on:
  push:
    branches: [master, upgrade-test-newrules-reorg]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'

      - name: Setup Yarn
        uses: yarnpkg/setup-action@main

      - name: Debug OIDC
        run: |
          echo "URL=${ACTIONS_ID_TOKEN_REQUEST_URL:+present}"
          echo "TOKEN=${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+present}"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run lint
        run: yarn lint

      - name: Run tests
        run: yarn vitest run
